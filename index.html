<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171816" />
  <meta name="description" content="Un'esperienza riflessiva della Grangia di Monluè." />
  <title>La Grangia di Monluè — Un viaggio immaginario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#sceneTitle">Vai al contenuto</a>

  <main id="app" class="app is-home">
    <div class="photo-background" aria-hidden="true"></div>

    <header class="topbar">
      <a class="wordmark" href="#" id="homeLink" aria-label="Torna alla pagina iniziale">
        <img src="assets/img/grangia-logo.png" alt="La Grangia di Monluè" />
      </a>

      <div class="topbar-status" aria-live="polite">
        <span id="sceneCounter">Esperienza immersiva</span>
      </div>
    </header>

    <div class="overall-progress" aria-hidden="true">
      <span id="overallProgress"></span>
    </div>

    <section id="homeScreen" class="home-screen" aria-labelledby="homeTitle">
      <div class="home-copy">
        <p class="overline">40 anni · La Grangia di Monluè</p>
        <h1 id="homeTitle">Un viaggio<br />immaginario</h1>
        <p class="home-intro">
          Un’esperienza riflessiva. Ci saranno momenti di ascolto, silenzio e domande personali.
          Puoi fermarti, tornare indietro o proseguire in qualsiasi momento.
        </p>

        <div class="home-actions">
          <button id="startBtn" class="button button-primary" type="button">
            Inizia l’esperienza immersiva
          </button>
        </div>
      </div>
    </section>

    <section id="experience" class="experience" hidden aria-live="polite">
      <article id="scene" class="scene">
        <div class="scene-inner">
          <p id="sceneKicker" class="scene-kicker"></p>
          <h1 id="sceneTitle" class="scene-title" tabindex="-1"></h1>
          <div id="sceneBody" class="scene-body"></div>

          <div id="reflectionPaper" class="reflection-paper" hidden>
            <span id="paperLabel" class="paper-label"></span>
            <p id="paperQuestion" class="paper-question"></p>
            <p id="paperInstruction" class="paper-instruction"></p>
          </div>

          <div id="checkpoint" class="checkpoint" hidden>
            <p id="checkpointHint"></p>
            <button id="checkpointBtn" class="button button-primary" type="button"></button>
          </div>

          <div id="finalActions" class="final-actions" hidden>
            <button id="restartBtn" class="button button-primary" type="button">Ricomincia</button>
          </div>
        </div>
      </article>
    </section>

    <div id="countdown" class="countdown" hidden aria-live="assertive">
      <p>Il viaggio comincia tra</p>
      <strong id="countdownValue">5</strong>
    </div>

    <div id="pauseNotice" class="pause-notice" hidden role="status">Esperienza in pausa</div>

    <footer id="controls" class="controls" hidden aria-label="Controlli dell’esperienza">
      <div class="transport-controls">
        <button id="stopBtn" class="control-button control-text" type="button" aria-label="Interrompi e torna alla pagina iniziale">Esci</button>
        <button id="previousBtn" class="control-button" type="button" aria-label="Schermata precedente">
          <span aria-hidden="true">←</span>
        </button>
        <button id="pauseBtn" class="control-button control-pause" type="button" aria-label="Metti in pausa">
          <span id="pauseIcon" aria-hidden="true">Ⅱ</span>
          <span id="pauseLabel">Pausa</span>
        </button>
        <button id="nextBtn" class="control-button" type="button" aria-label="Schermata successiva">
          <span aria-hidden="true">→</span>
        </button>
      </div>

      <div class="scene-timing" aria-hidden="true">
        <span id="sceneProgress"></span>
      </div>

      <div class="utility-controls">
        <button id="fullscreenBtn" class="control-button control-text" type="button">Schermo intero</button>
      </div>
    </footer>
  </main>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
